[versions]
agp = "9.3.0"
kotlin = "2.2.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2024.09.00"
# 🍏 Room 2.8.x = soporte KMP real (artefactos iosArm64 verificados). 2.7.0 fue la primera
# compatible con KSP2/Kotlin 2.x; se sube para poder mover la BD a `:shared` (Fase 4).
roomVersion = "2.8.4"
# Driver SQLite empaquetado: es el que usa Room en iOS (en Android se sigue usando el del sistema).
sqliteVersion = "2.6.0"
preferenceKtx = "1.2.1"
# Firebase Authentication (Google Sign-In) + plugin google-services
firebaseBom = "33.5.1"
playServicesAuth = "21.2.0"
googleServices = "4.4.2"
# Hilt (DI). ⚠️ CONFIRMAR/ajustar en el primer sync: la versión debe ser compatible con
# Kotlin 2.2 + KSP2 (ksp 2.3.2) + AGP 9. Si el sync se queja, sube a la última 2.5x/2.6x de la
# matriz Hilt del momento (Hilt usa KSP aquí, NO kapt). hilt-navigation-compose da hiltViewModel().
hilt = "2.57.1"
hiltNavigationCompose = "1.2.0"
# 🍏 kotlinx.serialization (Fase 3). 1.9.0 es la última que NO exige subir Kotlin por encima
# del 2.2.10 que usa el proyecto (la Fase 1 decidió no mover Kotlin todavía).
kotlinxSerialization = "1.9.0"
# 🍏 Fase 4. multiplatform-settings ENVUELVE el SharedPreferences que ya existe en Android
# (SharedPreferencesSettings) -> los ajustes del jugador se conservan SIN migrar nada. En iOS usa
# NSUserDefaults. Se eligio sobre DataStore (que recomendaba el plan) por eso y porque DataStore
# es asincrono: obligaria a volver suspend ~60 lecturas que hoy son sincronas.
multiplatformSettings = "1.3.0"
# Ktor sustituye a OkHttp (WebSocket del multijugador). Motor OkHttp en Android, Darwin en iOS.
ktor = "3.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomVersion" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomVersion" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "roomVersion" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preferenceKtx" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Firebase Authentication (Google Sign-In)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
# Hilt (DI): runtime + compilador (por KSP) + integración con Navigation Compose (hiltViewModel()).
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# 🍏 JSON multiplataforma (Fase 3). Vive en `:shared` y `:app` lo hereda por `api(...)`.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# 🍏 KMP (Fase 1 de PLAN_MIGRACION_KMP.md). Van con la MISMA versión de Kotlin/AGP que ya usa
# el proyecto: la Fase 1 NO sube Kotlin a propósito (decisión del dueño, 2026-07-27) para no
# mover AGP/KSP/Hilt/Compose justo después de publicar la 1.0.0.14.
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# 🍏 Fase 3: sustituye a Gson, que usa reflexión de la JVM y NO existe en iOS. El plugin va con la
# MISMA versión de Kotlin (lo genera el compilador), por eso `version.ref = "kotlin"`.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.2" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# 🍏 Plugin de Room (Fase 4): necesario para generar el codigo de la BD en un modulo KMP.
room = { id = "androidx.room", version.ref = "roomVersion" }