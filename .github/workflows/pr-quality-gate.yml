name: PR Quality Gate

# Gate de CALIDAD que corre en cada PR ABIERTO/actualizado hacia main (ANTES del merge):
#   1) tests unitarios (testDebugUnitTest)  -> GATE DURO (bloquea)
#   2) analisis estatico con detekt          -> GATE DURO (bloquea; deuda vieja va al baseline)
# NO toca ni depende del workflow de deploy (`android-release.yml`), que corre al CERRAR/MERGEAR el PR.
# Por eso este usa types: [opened, synchronize, reopened] (PR vivo) y aquel usa types: [closed].

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'PolitecnicoOpenWorld/**'

# Cancela ejecuciones viejas del mismo PR cuando se hace push de nuevos commits.
concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1) Tests unitarios de logica pura (GATE DURO: si fallan, el PR no debe mergear) ──────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # "wrapper" = usa la version declarada en gradle-wrapper.properties del repo.
          # (Fallo 2026-07-15: el pin "9.4.1" quedo atras cuando el proyecto subio a
          # AGP 9.3.0 + Gradle 9.5.0 — AGP 9.3 exige Gradle >= 9.5 y el job moria al
          # configurar. Con "wrapper" ya no hay que tocar el YAML en cada upgrade.)
          gradle-version: wrapper
      - name: Create secrets.properties (Maps API key; vacio es valido para tests)
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > PolitecnicoOpenWorld/secrets.properties
      # NOTA: no se escribe google-services.json a proposito -> el plugin google-services NO se aplica
      # (ver app/build.gradle.kts) y el proyecto compila/testea sin Firebase. Es lo que queremos en el gate.
      # assembleDebug + testDebugUnitTest: (1) ARMA la app (compila, valida el grafo Hilt COMPLETO
      # y el merge de manifest/recursos — cosas que los unit tests no cubren; clave tras la Etapa 4
      # de DI), y (2) corre los tests de lógica pura. Ambos deben pasar para mergear.
      # 🍏 Tests del modulo KMP `:shared` (dominio puro de SF + GeoPoint). Hoy el reparto es
      # 112 en `:app` + 49 en `:shared` = 161. Si mueves mas dominio a `:shared`, el reparto
      # cambia: lo que importa es que la SUMA no baje.
      # ⚠️ LA TAREA SE LLAMA `testAndroidHostTest`, NO `testDebugUnitTest`: cambio en la Fase 5
      # al pasar a `com.android.kotlin.multiplatform.library` (AGP 9 ya no admite
      # `com.android.library` junto a KMP). Con el nombre viejo, Gradle falla con 'task not found'.
      - name: Build debug APK + run unit tests
        working-directory: ./PolitecnicoOpenWorld
        run: gradle :app:assembleDebug :app:testDebugUnitTest :shared:testAndroidHostTest --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: PolitecnicoOpenWorld/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # ── 2) Analisis estatico con detekt (BLOQUEANTE con baseline — Etapa 5, 2026-07-04) ───────────
  # Ya NO es advisory: se retiro `continue-on-error: true`. La deuda de estilo PREEXISTENTE queda
  # PERDONADA por `config/detekt/baseline.xml` (Opcion A del PENDIENTE_calidad.md); detekt solo falla
  # ante issues NUEVOS (codigo que se agregue de aqui en adelante). maxIssues:0 en el .yml.
  # Regenerar el baseline (tras limpiar deuda o al subir la version de detekt):
  #   ./detekt-cli-1.23.8/bin/detekt-cli --create-baseline \
  #     --baseline PolitecnicoOpenWorld/config/detekt/baseline.xml \
  #     --config PolitecnicoOpenWorld/config/detekt/detekt.yml \
  #     --build-upon-default-config \
  #     --input PolitecnicoOpenWorld/app/src/main/java,PolitecnicoOpenWorld/shared/src/commonMain/kotlin
  # Se usa la CLI (no el plugin Gradle) para NO tocar el build de la app (imposible romper assemble/bundle).
  detekt:
    runs-on: ubuntu-latest
    env:
      DETEKT_VERSION: "1.23.8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Download detekt CLI
        run: |
          curl -sSL -o detekt-cli.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          # -o = sobreescribir SIN preguntar: el zip de detekt trae entradas duplicadas y el
          # prompt interactivo de unzip ("replace ...-all.jar?") moria con EOF → exit 1
          # (fallo reportado 2026-07-15: el job caia ANTES de analizar nada).
          unzip -q -o detekt-cli.zip
      - name: Run detekt (blocking)
        run: |
          BASELINE_ARG=""
          if [ -f PolitecnicoOpenWorld/config/detekt/baseline.xml ]; then
            BASELINE_ARG="--baseline PolitecnicoOpenWorld/config/detekt/baseline.xml"
          fi
          "./detekt-cli-${DETEKT_VERSION}/bin/detekt-cli" \
            --config PolitecnicoOpenWorld/config/detekt/detekt.yml \
            --build-upon-default-config \
            --input PolitecnicoOpenWorld/app/src/main/java,PolitecnicoOpenWorld/shared/src/commonMain/kotlin \
            $BASELINE_ARG \
            --report sarif:detekt-results.sarif
      - name: Upload detekt SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-sarif
          path: detekt-results.sarif
          if-no-files-found: ignore
