name: Android CI/CD

on:
  # 🆕 Disparo MANUAL desde la pestaña Actions ("Run workflow"). Útil cuando el merge no pudo
  # lanzar el flujo (p. ej. el workflow de main estaba inválido) o para relanzar una subida.
  workflow_dispatch:
  # Al MERGEAR un PR a main: APK debug + GitHub Release + AAB firmado → Play (prueba cerrada).
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - 'PolitecnicoOpenWorld/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # ── 0) PUERTA DE CUMPLIMIENTO DE PLAY ─────────────────────────────────────
  # Bloquea la subida si se repite alguno de los motivos por los que Google nos RECHAZÓ el
  # 2026-07-22 (5 correos = 3 problemas). Ver README for IAS/PLAYSTORE_formulario_seguridad_datos.md:
  #   1. "Invalid Privacy policy"  → policy_en_es.html daba 404
  #   2. "Invalid account deletion link" → account-deletion.html daba 404
  #      (causa RAÍZ de los dos: se borró la rama gh-pages, que es la que los sirve)
  #   3. "Invalid Data safety form" → faltaba declarar el correo (eso es del formulario, no
  #      automatizable; aquí se recuerda en el resumen del job)
  # El 90% de los rechazos fue el punto 1-2, y son EXACTAMENTE lo que se comprueba aquí.
  play-compliance:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      POLICY_URL: https://gabrielhuav.github.io/PolitecnicoOpenWorld/policy_en_es.html
      DELETION_URL: https://gabrielhuav.github.io/PolitecnicoOpenWorld/account-deletion.html
      CONTACT_EMAIL: gabrielhuav@gmail.com
      WRONG_EMAIL: iiaragonii6@gmail.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Causa RAÍZ de los rechazos 1 y 2: sin gh-pages, las dos URLs dan 404.
      - name: gh-pages debe existir (es infraestructura de cumplimiento, no una rama cualquiera)
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::error::La rama gh-pages NO existe. Es la que sirve la política de privacidad"
            echo "::error::y la página de eliminación de cuenta. Sin ella Play RECHAZA la app"
            echo "::error::(nos pasó el 2026-07-22). Restáurala antes de publicar."
            exit 1
          fi
          echo "gh-pages presente."

      - name: Las 2 URLs de políticas deben cargar (no 404) y traer el correo correcto
        run: |
          FAIL=0
          for URL in "$POLICY_URL" "$DELETION_URL"; do
            echo "── Comprobando $URL"
            CODE=$(curl -sS -L --retry 4 --retry-delay 5 --retry-all-errors --max-time 45 \
                   -o page.html -w '%{http_code}' "$URL" || echo "000")
            if [ "$CODE" != "200" ]; then
              echo "::error::$URL respondió HTTP $CODE (se esperaba 200)."
              echo "::error::Este es EXACTAMENTE el motivo de rechazo de Play del 2026-07-22."
              FAIL=1
              continue
            fi
            # Una página servida pero vacía/rota también invalida el enlace ante Google.
            BYTES=$(wc -c < page.html)
            if [ "$BYTES" -lt 500 ]; then
              echo "::error::$URL devolvió 200 pero solo $BYTES bytes: la página parece rota."
              FAIL=1
            fi
            # El correo de contacto/eliminación debe ser real y del dueño.
            if ! grep -qF "$CONTACT_EMAIL" page.html; then
              echo "::error::$URL NO contiene el correo de contacto $CONTACT_EMAIL."
              FAIL=1
            fi
            if grep -qF "$WRONG_EMAIL" page.html; then
              echo "::error::$URL contiene el correo EQUIVOCADO $WRONG_EMAIL (ver playbook §2)."
              FAIL=1
            fi
            [ "$FAIL" -eq 0 ] && echo "OK: HTTP 200, $BYTES bytes, correo correcto."
          done
          exit $FAIL

      # El paso de subida usa whatsNewDirectory: si faltan, el release llega sin notas.
      - name: Notas de la versión presentes (ES + EN)
        run: |
          MISSING=0
          for F in distribution/whatsnew/whatsnew-es-MX distribution/whatsnew/whatsnew-en-US; do
            if [ ! -s "$F" ]; then
              echo "::error::Falta o está vacío $F (lo usa whatsNewDirectory al publicar)."
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Recordatorio del formulario (lo único que NO se puede automatizar)
        run: |
          {
            echo "### ✅ Puerta de cumplimiento de Play superada"
            echo ""
            echo "Verificado automáticamente:"
            echo "- Rama \`gh-pages\` presente (causa raíz de los 404 de 2026-07-22)."
            echo "- Política de privacidad y eliminación de cuenta: **HTTP 200** y correo correcto."
            echo "- Notas de versión ES + EN presentes."
            echo ""
            echo "> ⚠️ **Revisa a mano** si añadiste un SDK nuevo (analytics, ads, un backend que"
            echo "> reciba más datos, o si empiezas a mandar el GPS al servidor): entonces hay que"
            echo "> declarar los datos nuevos en **Seguridad de los datos** Y actualizar la política."
            echo "> Formulario ≠ realidad = rechazo. Ver \`PLAYSTORE_formulario_seguridad_datos.md\` §6."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 1) MERGE de PR → APK debug + GitHub Release ───────────────────────────
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # "wrapper" = la version de gradle-wrapper.properties (sincronizada con el repo;
          # el pin fijo quedaba atras en cada upgrade de AGP/Gradle — fallo 2026-07-15).
          gradle-version: wrapper
      - name: Create secrets.properties file
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > PolitecnicoOpenWorld/secrets.properties
      # 🆕 (2026-07-22) FUENTE ÚNICA de la versión: se LEE de build.gradle.kts (el mismo número
      # que estampa el AAB) → ya no se hardcodea en el YAML. El job `bump-version` (abajo) la
      # sube +1 tras cada release, así que 13 → 14 → 15… salen solos sin editar nada a mano.
      - name: Leer versionName de build.gradle.kts
        run: |
          V=$(grep -oE 'versionName = "[0-9.]+"' PolitecnicoOpenWorld/app/build.gradle.kts \
              | grep -oE '[0-9]+(\.[0-9]+)+')
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "versionName leído: $V"
      - name: Build APK
        working-directory: ./PolitecnicoOpenWorld
        run: gradle :app:assembleDebug
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          tag_name: debug-latest
          name: "Latest Debug APK"
          body: |
            POW ${{ env.VERSION_NAME }} — Huelum vs. Goya

            - Lanzamiento del modo Huelum vs. Goya.
            - Mejoras de jugabilidad y estabilidad en la campaña principal de POW.
            - Voces y efectos especiales renovados para Street Fighter POW.

            PR: #${{ github.event.pull_request.number }}
            Autor: @${{ env.PR_AUTHOR }}
            Commit: ${{ github.sha }}
          make_latest: true
          draft: false
          prerelease: false
          files: |
            PolitecnicoOpenWorld/app/build/outputs/apk/debug/app-debug.apk

  # ── 2) PR MERGEADO a main → AAB firmado → Play Store PRUEBA CERRADA (track "alpha") ──
  playstore-closed-testing:
    # 🆕 (2026-07-26) NO se sube nada a Play si la puerta de cumplimiento falla: es la red que
    # evita repetir los rechazos de 2026-07-22 (políticas en 404 por haber borrado gh-pages).
    needs: [play-compliance]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # "wrapper" = la version de gradle-wrapper.properties (sincronizada con el repo;
          # el pin fijo quedaba atras en cada upgrade de AGP/Gradle — fallo 2026-07-15).
          gradle-version: wrapper
      - name: Create secrets.properties (Maps API key)
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > PolitecnicoOpenWorld/secrets.properties
      # 🆕 (2026-07-22) FUENTE ÚNICA de la versión: se LEE de build.gradle.kts (el número que
      # estampa el AAB) para nombrar el artefacto y el release de Play sin hardcodear nada.
      - name: Leer versionName de build.gradle.kts
        run: |
          V=$(grep -oE 'versionName = "[0-9.]+"' PolitecnicoOpenWorld/app/build.gradle.kts \
              | grep -oE '[0-9]+(\.[0-9]+)+')
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "versionName leído: $V"
      - name: google-services.json (opcional; habilita Firebase/multijugador si el secret existe)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" | base64 -d > PolitecnicoOpenWorld/app/google-services.json
            echo "google-services.json escrito (Firebase habilitado)."
          else
            echo "Sin GOOGLE_SERVICES_JSON: build sin Firebase (multijugador deshabilitado)."
          fi
      - name: Decodificar keystore (.jks) desde el secret base64
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/PolitecnicoOpenWorld/app/release-keystore.jks"
      # 🆕 Pre-vuelo de firma: si el keystore está corrupto o la contraseña/alias no casan, el
      # fallo real queda oculto dentro de `signReleaseBundle` ("A failure occurred..."). Aquí lo
      # sacamos a la luz ANTES de compilar 5 min, sin filtrar secretos (keytool no imprime la clave).
      - name: Verificar keystore (contraseña + alias) antes de firmar
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KS="$GITHUB_WORKSPACE/PolitecnicoOpenWorld/app/release-keystore.jks"
          SIZE=$(stat -c%s "$KS" 2>/dev/null || echo 0)
          echo "Keystore decodificado: ${SIZE} bytes."
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::El keystore quedó vacío/corrupto tras decodificar RELEASE_KEYSTORE_BASE64."
            echo "::error::Regénéralo con:  base64 -w0 release-keystore.jks   y pégalo tal cual en el secret."
            exit 1
          fi
          # ¿La contraseña del STORE abre el keystore?
          if ! keytool -list -keystore "$KS" -storepass "$RELEASE_STORE_PASSWORD" >/tmp/ks.txt 2>/tmp/ks.err; then
            echo "::error::No se pudo abrir el keystore con RELEASE_STORE_PASSWORD (contraseña incorrecta o .jks corrupto)."
            sed 's/[Pp]assword[^ ]*/[oculto]/g' /tmp/ks.err
            exit 1
          fi
          # ¿Existe el alias indicado dentro del keystore?
          if ! keytool -list -keystore "$KS" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::El alias '$RELEASE_KEY_ALIAS' (RELEASE_KEY_ALIAS) NO existe en el keystore."
            echo "Alias disponibles en el keystore:"
            grep -iE 'alias name' /tmp/ks.txt || echo "  (no se pudieron listar; revisa /tmp/ks.txt)"
            exit 1
          fi
          echo "Keystore OK: se abre con la contraseña y el alias '$RELEASE_KEY_ALIAS' existe."
          echo "(Si aun así falla la firma, el culpable es RELEASE_KEY_PASSWORD: la clave del alias.)"
      # 🆕 versionCode AUTOINCREMENTAL: Play rechaza subir dos veces el mismo código. Antes
      # quedaba fijo en 12 (el default de build.gradle.kts) y el upload fallaba con
      # "Version code 12 has already been used". run_number siempre crece; +1000 lo deja muy
      # por encima de los ya publicados. OJO: las expresiones ${{ }} de Actions NO permiten
      # aritmética, por eso la suma se hace en shell y se exporta con GITHUB_ENV.
      - name: Calcular versionCode
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build AAB firmado (bundleRelease)
        working-directory: ./PolitecnicoOpenWorld
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/PolitecnicoOpenWorld/app/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        # --stacktrace: si la firma vuelve a fallar, muestra la causa REAL (p. ej. "Cannot recover
        # key" = RELEASE_KEY_PASSWORD incorrecta) en vez del genérico "A failure occurred...".
        run: gradle :app:bundleRelease --stacktrace
      - name: Validar tamaño máximo de Play Store
        shell: bash
        run: |
          AAB="PolitecnicoOpenWorld/app/build/outputs/bundle/release/app-release.aab"
          SIZE_BYTES=$(stat -c%s "$AAB")
          MB=$((SIZE_BYTES / 1000000))
          MAX_BYTES=500000000     # tope duro: aquí el build FALLA
          WARN_BYTES=450000000    # aviso temprano: 90 % del tope

          echo "AAB: ${MB} MB · aviso a 450 MB · tope 500 MB"

          # De dónde sale el peso. Sin esto, cuando el AAB crece nadie sabe qué lo hizo crecer
          # y hay que reproducirlo a mano en local. MEDIDO 2026-07-30: 416 MB, de los cuales
          # STREETFIGHTER 112 y SPRITES 106 — el 52 % son dos carpetas de assets.
          echo "### Peso del AAB por carpeta" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$AAB" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import zipfile, sys, collections
          z = zipfile.ZipFile(sys.argv[1])
          por = collections.Counter()
          for i in z.infolist():
              p = i.filename.split('/')
              por['/'.join(p[1:3]) if len(p) > 2 else '/'.join(p[:2])] += i.compress_size
          tot = sum(por.values()) or 1
          print(f"TOTAL {tot/1e6:.0f} MB")
          for k, v in por.most_common(12):
              print(f"{k:34} {v/1e6:7.1f} MB {100*v/tot:5.1f}%")
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error::El AAB pesa ${MB} MB y supera el tope de 500 MB. Play Store puede rechazar el módulo base."
            exit 1
          elif [ "$SIZE_BYTES" -gt "$WARN_BYTES" ]; then
            echo "::warning::El AAB pesa ${MB} MB y ya pasó el aviso de 450 MB. Quedan menos de 50 MB de margen: mira el desglose del resumen antes de añadir assets."
          fi
      - name: Guardar AAB firmado como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ env.VERSION_NAME }}
          path: PolitecnicoOpenWorld/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Subir a Play Store (prueba cerrada)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'manual-play-upload') }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ovh.gabrielhuav.pow
          releaseFiles: PolitecnicoOpenWorld/app/build/outputs/bundle/release/app-release.aab
          # "alpha" = pista de PRUEBA CERRADA clásica. Si creaste una pista cerrada con nombre
          # propio en Play Console, pon aquí ese nombre exacto.
          tracks: alpha
          status: completed
          releaseName: "POW ${{ env.VERSION_NAME }} — Huelum vs. Goya"
          whatsNewDirectory: distribution/whatsnew
      - name: Confirmar entrega manual solicitada
        if: ${{ contains(github.event.pull_request.labels.*.name, 'manual-play-upload') }}
        run: echo "Subida automática omitida; usa el artefacto firmado app-release-${{ env.VERSION_NAME }}."
      - name: Borrar keystore del runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/PolitecnicoOpenWorld/app/release-keystore.jks"

  # ── 3) AUTO-INCREMENTO del versionName: tras un release REAL (merge a main), sube el patch
  # +1 en build.gradle.kts + whatsnew y lo commitea a main. Así 13 → 14 → 15… salen solos sin
  # editar nada a mano. Solo corre en el merge (no en workflow_dispatch) para no doble-incrementar.
  # ⚠️ Requiere que `main` PERMITA el push de github-actions (si es rama protegida, dale a
  # Actions un bypass en Settings → Branches, o falla con 403). El `[skip ci]` evita relanzar.
  bump-version:
    needs: [release, playstore-closed-testing]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # 🆕 Si `main` es rama protegida con "Require a pull request", el push directo del
          # bot lo bloquea el GITHUB_TOKEN normal. Solución: crea un PAT del dueño (admin, que
          # esté en el Bypass list del ruleset) y guárdalo como secret RELEASE_PAT; el push lo
          # usa y pasa el bypass. Si no hay PAT, cae al GITHUB_TOKEN (sirve si main NO está
          # protegida o si añadiste GitHub Actions al Bypass list).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - name: Incrementar patch (build.gradle.kts + whatsnew)
        run: |
          FILE=PolitecnicoOpenWorld/app/build.gradle.kts
          CUR=$(grep -oE 'versionName = "[0-9.]+"' "$FILE" | grep -oE '[0-9]+(\.[0-9]+)+')
          BASE=$(echo "$CUR" | sed -E 's/\.[0-9]+$//')   # 1.0.0
          PATCH=$(echo "$CUR" | grep -oE '[0-9]+$')       # 13
          NEXT="${BASE}.$((PATCH + 1))"                    # 1.0.0.14
          sed -i "s/versionName = \"$CUR\"/versionName = \"$NEXT\"/" "$FILE"
          sed -i "1s/.*/POW $NEXT/" distribution/whatsnew/whatsnew-es-MX
          sed -i "1s/.*/POW $NEXT/" distribution/whatsnew/whatsnew-en-US
          echo "versionName $CUR -> $NEXT"
          echo "NEXT_VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "PREV_VERSION=$CUR" >> "$GITHUB_ENV"
      - name: Commit & push a main
        run: |
          git config user.name "pow-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PolitecnicoOpenWorld/app/build.gradle.kts \
                  distribution/whatsnew/whatsnew-es-MX distribution/whatsnew/whatsnew-en-US
          git commit -m "chore: bump versionName ${PREV_VERSION} -> ${NEXT_VERSION} [skip ci]" \
            || { echo "Sin cambios que commitear"; exit 0; }
          git push origin main
